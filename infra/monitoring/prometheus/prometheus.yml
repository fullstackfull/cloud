---
# Prometheus for the Lynomia control plane.
#
# Targets are file-discovered rather than listed here, so adding a machine is
# an inventory change that goes through infra/scripts/validate-inventory.py
# rather than an edit to the scrape config.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: "${LYNOMIA_ENVIRONMENT}"

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: lynomia-control-plane
    metrics_path: /metrics
    scheme: https
    # The metrics endpoint carries no customer identifiers — an architecture
    # test (MetricsCarryNoIdentifiersTest) keeps that true — but it does expose
    # commercial aggregates such as MRR, so it is behind a bearer token.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    file_sd_configs:
      - files: ['/etc/prometheus/targets/control-plane.json']

  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.json']

  - job_name: postgres
    file_sd_configs:
      - files: ['/etc/prometheus/targets/postgres.json']

  - job_name: redis
    file_sd_configs:
      - files: ['/etc/prometheus/targets/redis.json']

  - job_name: proxmox
    file_sd_configs:
      - files: ['/etc/prometheus/targets/proxmox.json']
