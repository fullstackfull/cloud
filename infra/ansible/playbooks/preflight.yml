---
# Preflight. Reads; never writes, not even in a role's handler.
#
# Answers three questions before anything else runs:
#   1. Does every host carry a deliberate safety classification?
#   2. Can we actually reach it?
#   3. Is it the machine the inventory says it is?

- name: Preflight
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  check_mode: true
  tasks:
    - name: Classification is present and legible
      ansible.builtin.include_role:
        name: safety_gate
      vars:
        safety_gate_action: read
      when: safety_class | default('DO_NOT_TOUCH') != 'DO_NOT_TOUCH'

    - name: Report a DO_NOT_TOUCH host without connecting to it
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is DO_NOT_TOUCH; preflight is not connecting to it.
      when: safety_class | default('DO_NOT_TOUCH') == 'DO_NOT_TOUCH'

    - name: The host answers
      ansible.builtin.wait_for_connection:
        timeout: 15
      when: safety_class | default('DO_NOT_TOUCH') != 'DO_NOT_TOUCH'

    - name: Collect the facts we will compare against the inventory
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - distribution
          - kernel
          - hardware
      when: safety_class | default('DO_NOT_TOUCH') != 'DO_NOT_TOUCH'

    - name: What is actually there
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ ansible_distribution | default('?') }} {{ ansible_distribution_version | default('') }},
          kernel {{ ansible_kernel | default('?') }},
          {{ ansible_processor_vcpus | default('?') }} vCPU,
          {{ ansible_memtotal_mb | default('?') }} MB
      when: safety_class | default('DO_NOT_TOUCH') != 'DO_NOT_TOUCH'
