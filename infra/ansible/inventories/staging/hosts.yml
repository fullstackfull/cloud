---
# Lynomia staging.
#
# There are no hosts here. As of Phase 30B no staging machine has been made
# reachable to the environment that runs these playbooks, and the phase's rule
# is that this tree records what was observed rather than what is intended.
# Adding a host here is the act that makes it a deployment target, so it is done
# by a person who owns the machine, with a safety_class they chose deliberately.
#
# See docs/phase-30b-real-infrastructure-inventory.md for what was probed.
all:
  vars:
    lynomia_environment: staging
  children:
    control_plane:
      hosts: {}
    database:
      hosts: {}
    cache:
      hosts: {}
    monitoring:
      hosts: {}
    proxmox_nodes:
      hosts: {}
    backup_targets:
      hosts: {}
    hosting_nodes:
      hosts: {}
    dedicated_bmc:
      hosts: {}
