---
# EXAMPLE INVENTORY — NOT A DEPLOYMENT TARGET.
#
# Every host below is fictional. This file exists so that CI exercises
# infra/scripts/validate-inventory.py against each safety class, including the
# combinations that must fail. infra/scripts/preflight.sh refuses the name
# "examples" outright, so this cannot be deployed by accident.
all:
  vars:
    lynomia_environment: examples
  children:
    control_plane:
      hosts:
        cp-example-1:
          ansible_host: 198.51.100.11
          safety_class: CONFIGURATION_ALLOWED
          allow_reimage: false
          credentials_available: false
          purpose: "Example control plane node, illustrates CONFIGURATION_ALLOWED"
          owner: "example, nobody"
    proxmox_nodes:
      hosts:
        pve-example-1:
          ansible_host: 198.51.100.21
          safety_class: DISCOVERY_ONLY
          allow_reimage: false
          credentials_available: false
          purpose: "Example hypervisor, illustrates read-only discovery"
          owner: "example, nobody"
        pve-example-2:
          ansible_host: 198.51.100.22
          safety_class: REIMAGE_ALLOWED
          allow_reimage: true
          credentials_available: false
          purpose: "Example disposable node, illustrates the one class that may be wiped"
          owner: "example, nobody"
    hosting_nodes:
      hosts:
        web-example-1:
          ansible_host: 198.51.100.31
          safety_class: DO_NOT_TOUCH
          allow_reimage: false
          credentials_available: false
          purpose: "Example machine of unknown ownership, illustrates the default"
          owner: "example, unknown"
