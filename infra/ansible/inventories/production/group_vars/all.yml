---
# Group variables for production.
#
# Values here are configuration, never credentials. Anything secret arrives as
# an environment variable on the deployment controller and is referenced with
# lookup('env', ...) at the point of use, so that a checkout of this repository
# never carries one.
lynomia_environment: production
lynomia_release_ref: "{{ lookup('env', 'LYNOMIA_RELEASE_REF') | default('', true) }}"
lynomia_app_root: /srv/lynomia
lynomia_php_version: "8.4"
lynomia_postgres_version: 18
lynomia_run_user: lynomia
