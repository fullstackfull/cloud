---
- name: Base packages are present
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

- name: The clock agrees with everyone else's
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ common_timezone }}"
  changed_when: false

- name: The application user exists
  ansible.builtin.user:
    name: "{{ lynomia_run_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ lynomia_app_root }}"
    create_home: false

- name: The application root exists
  ansible.builtin.file:
    path: "{{ lynomia_app_root }}"
    state: directory
    owner: "{{ lynomia_run_user }}"
    group: "{{ lynomia_run_user }}"
    mode: "0750"
