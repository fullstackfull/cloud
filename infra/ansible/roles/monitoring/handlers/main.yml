---
- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded

- name: Reload alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: reloaded

- name: Restart loki
  ansible.builtin.systemd_service:
    name: loki
    state: restarted
