# Control-plane alerts, driven by the platform's own /metrics endpoint plus the
# database and queue exporters.
#
# A note on the `lynomia_*_total` series that these rules use.
#
# `lynomia_orders_total` and `lynomia_provisioning_jobs_total` are exported with
# TYPE gauge despite the `_total` suffix, because they are counts of rows in
# each state and a row moves between states: the number of jobs in `queued` goes
# down when a worker picks one up. Only terminal states (succeeded, failed,
# needs_review, cancelled) are monotonic. Every rule below therefore uses
# delta() over terminal states and never rate() or increase(), which assume a
# counter and would silently misread every reset as a wrap.

groups:
  - name: platform.availability
    rules:
      - alert: ControlPlaneMetricsDown
        # The endpoint every business alert in this file depends on. When it is
        # down, provisioning, IP runway and revenue alerts all evaluate to
        # nothing at all — which reads on a dashboard as "everything is fine".
        expr: up{job="control-plane"} == 0
        for: 5m
        labels:
          severity: warning
          component: control-plane
        annotations:
          summary: 'Control plane metrics endpoint on {{ $labels.instance }} is not scrapeable'
          description: >-
            Prometheus cannot scrape {{ $labels.instance }}. The guard answers 404 rather
            than 401 so the endpoint does not confirm its own existence to a scanner, so
            a 404 here means the metrics token was rotated in the application but not in
            /etc/prometheus/secrets/control-plane-metrics-token — the application's log
            carries the refusal and the reason. A timeout instead means the collectors
            have stopped being cheap and want profiling. Until either is fixed, every
            provisioning, capacity and revenue alert is silent.
          runbook_url: https://docs.lynomia.internal/runbooks/metrics-endpoint

      - alert: MetricsCollectorFailing
        # A scrape that succeeds while one collector inside it is throwing.
        # The families that collector owns are simply absent, so every alert
        # built on them evaluates to nothing and stays quiet — which is
        # indistinguishable from good news. This is the series that is not.
        expr: lynomia_metrics_collector_up == 0
        for: 15m
        labels:
          severity: warning
          component: control-plane
        annotations:
          summary: 'The {{ $labels.collector }} metrics collector is failing'
          description: >-
            The scrape is succeeding but the {{ $labels.collector }} collector threw on
            its last run, so the metrics it owns are missing rather than zero. The
            application log carries the exception class and message. Until it is fixed,
            treat the silence of every alert derived from that collector as meaningless.
          runbook_url: https://docs.lynomia.internal/runbooks/metrics-endpoint

      - alert: MetricsCollectionSlow
        # Cheapness, measured rather than asserted. A collector creeping from
        # milliseconds to seconds is invisible until the scrape times out, at
        # which point the endpoint installed to detect outages is causing one.
        expr: lynomia_metrics_collect_duration_seconds > 2
        for: 15m
        labels:
          severity: warning
          component: control-plane
        annotations:
          summary: 'The {{ $labels.collector }} collector is taking {{ $value | printf "%.1f" }}s'
          description: >-
            Collection is meant to be measured in milliseconds. At this rate the scrape
            will start timing out, and consecutive collections will overlap and hold
            database connections the application needs. Profile the collector's query
            before the scrape interval catches up with it.
          runbook_url: https://docs.lynomia.internal/runbooks/metrics-endpoint

      - alert: DatabaseUnavailable
        # pg_up is the exporter's own connection attempt, so it distinguishes
        # "Postgres is refusing connections" from "the exporter's host is gone",
        # which the companion `absent()` clause below covers instead.
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'PostgreSQL is not accepting connections'
          description: >-
            The exporter cannot connect to the control-plane database. Everything stops:
            the portals, the API, order placement, provisioning and billing. Check
            connection saturation before restarting anything — a full connection pool
            looks identical to an outage from here and a restart makes it worse.
          runbook_url: https://docs.lynomia.internal/runbooks/database-down
          dashboard_url: https://grafana.lynomia.internal/d/lynomia-platform/platform-overview

      - alert: DatabaseExporterMissing
        expr: absent(pg_up) or up{job="postgres"} == 0
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'The PostgreSQL exporter is not reporting'
          description: >-
            No pg_up series exists. The database may be perfectly healthy — but
            DatabaseUnavailable cannot fire while this is true, so the absence has to
            alert on its own.
          runbook_url: https://docs.lynomia.internal/runbooks/database-down

      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: queue
        annotations:
          summary: 'Redis is not accepting connections'
          description: >-
            Redis backs both the queue and the cache. While it is down no provisioning
            job is dispatched, so paid orders sit untouched and the backlog is invisible
            because the queue itself is unreachable.
          runbook_url: https://docs.lynomia.internal/runbooks/redis-down

      - alert: RedisExporterMissing
        expr: absent(redis_up) or up{job="redis"} == 0
        for: 5m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: 'The Redis exporter is not reporting'
          description: >-
            No redis_up series exists, so RedisUnavailable cannot fire regardless of
            what Redis is doing.
          runbook_url: https://docs.lynomia.internal/runbooks/redis-down

      - alert: RedisEvictingKeys
        # Eviction on a queue-backing Redis is not a cache-tuning matter. If
        # maxmemory-policy is anything but noeviction, a queued job payload can
        # be evicted, and the order it belongs to is then paid for and never
        # provisioned, with nothing anywhere recording that it was dropped.
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: queue
        annotations:
          summary: 'Redis has evicted {{ $value | printf "%.0f" }} keys in the last 15 minutes'
          description: >-
            Redis is under memory pressure and evicting. If any evicted key was a queued
            job, that work is gone silently — a paid order with no provisioning job and no
            error. Check maxmemory-policy is noeviction on the queue instance.
          runbook_url: https://docs.lynomia.internal/runbooks/redis-down

  - name: platform.provisioning
    rules:
      - alert: ProvisioningFailureSpike
        # A ratio, gated on volume. The gate is the important half: without it,
        # one failure out of two overnight orders is a 50% failure rate and
        # pages for nothing, and the on-call learns to ignore this alert before
        # the day it means something.
        expr: >-
          (
            sum(delta(lynomia_provisioning_jobs_total{status=~"failed|needs_review"}[30m]))
            /
            clamp_min(sum(delta(lynomia_provisioning_jobs_total{status=~"succeeded|failed|needs_review"}[30m])), 1)
          ) > 0.15
          and
          sum(delta(lynomia_provisioning_jobs_total{status=~"succeeded|failed|needs_review"}[30m])) >= 8
        for: 10m
        labels:
          severity: critical
          component: provisioning
        annotations:
          summary: 'Provisioning failure rate is {{ $value | humanizePercentage }} over the last 30 minutes'
          description: >-
            More than 15% of provisioning jobs completing in the last half hour ended in
            failure or manual review. A rate like this is systemic, not per-customer:
            an expired provider token, a deleted template, an exhausted pool or a
            hypervisor that stopped accepting work. Group the failures by kind before
            touching anything — the failing kind names the subsystem.
          runbook_url: https://docs.lynomia.internal/runbooks/provisioning-stuck
          dashboard_url: https://grafana.lynomia.internal/d/lynomia-business/business

      - alert: ProvisioningJobsAwaitingReview
        # needs_review is where a timeout lands. Nothing retries it and nothing
        # releases its resources by design, so it stays until a human looks —
        # and a queue of these is a queue of customers with a half-built server.
        expr: sum(lynomia_provisioning_jobs_total{status="needs_review"}) > 0
        for: 30m
        labels:
          severity: warning
          component: provisioning
        annotations:
          summary: '{{ $value | printf "%.0f" }} provisioning job(s) are awaiting manual review'
          description: >-
            These jobs stopped in a state the platform will not resolve on its own,
            which is almost always a provider timeout. The resource may exist at the
            provider. Reconcile against the provider before retrying: retrying a timeout
            is how a customer ends up with two of something.
          runbook_url: https://docs.lynomia.internal/runbooks/provisioning-stuck

      - alert: ProvisioningStalled
        # No completions at all while jobs are queued. The failure-rate alert
        # cannot see this: a pipeline that has stopped moving produces no
        # failures, only silence.
        expr: >-
          sum(delta(lynomia_provisioning_jobs_total{status=~"succeeded|failed|needs_review"}[30m])) == 0
          and
          sum(lynomia_provisioning_jobs_total{status="queued"}) > 0
        for: 20m
        labels:
          severity: critical
          component: provisioning
        annotations:
          summary: 'Provisioning has produced no outcomes for 30 minutes while work is queued'
          description: >-
            Jobs are queued and nothing is completing. Check that the queue workers are
            running at all before looking at any individual job — this is far more often
            a stopped worker or a wedged Horizon supervisor than a broken provider.
          runbook_url: https://docs.lynomia.internal/runbooks/provisioning-stuck

  - name: platform.queue
    rules:
      - alert: QueueBacklogGrowing
        # Depth alone is a bad alert: a burst of a thousand jobs that drains in
        # two minutes is healthy. The pairing with deriv() is what makes this
        # mean "arriving faster than they are being done" rather than "busy".
        expr: >-
          lynomia_queue_depth > 250
          and
          deriv(lynomia_queue_depth[15m]) > 0
        for: 15m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: 'Queue {{ $labels.queue }} has {{ $value | printf "%.0f" }} jobs and is still growing'
          description: >-
            Work is arriving on {{ $labels.queue }} faster than the workers are clearing
            it. On the provisioning queue this is paid customers waiting. Add workers or
            find the job that is blocking one — a single job holding a lock will produce
            exactly this shape.
          runbook_url: https://docs.lynomia.internal/runbooks/queue-backlog
          dashboard_url: https://grafana.lynomia.internal/d/lynomia-platform/platform-overview

      - alert: QueueBacklogSevere
        expr: lynomia_queue_depth > 2000
        for: 10m
        labels:
          severity: critical
          component: queue
        annotations:
          summary: 'Queue {{ $labels.queue }} has {{ $value | printf "%.0f" }} jobs pending'
          description: >-
            The backlog on {{ $labels.queue }} is large enough that even a healthy worker
            pool will take hours to clear it. Anything queued behind it — including
            provisioning for orders already paid — is delayed by that much.
          runbook_url: https://docs.lynomia.internal/runbooks/queue-backlog

      - alert: FailedJobsAppearing
        # lynomia_failed_jobs_total IS a real counter: rows are appended to
        # failed_jobs and only removed by an explicit flush, which Prometheus
        # handles as a counter reset.
        expr: increase(lynomia_failed_jobs_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
          component: queue
        annotations:
          summary: '{{ $value | printf "%.0f" }} jobs moved to failed_jobs in the last 15 minutes'
          description: >-
            Jobs are exhausting their retries. Read one exception before retrying the
            batch: a failed job that will fail identically on retry only wastes the
            worker capacity that the healthy jobs behind it need.
          runbook_url: https://docs.lynomia.internal/runbooks/queue-backlog
