# -----------------------------------------------------------------------------
# REFERENCE TARGET LIST — describes no machine that exists.
#
# Every name here is a host from the example inventory in
# infrastructure/ansible/inventories/production/hosts.yml, under `.example`,
# which IANA reserves for documents. The real target list is operator-supplied
# and lives with the private inventory: Prometheus re-reads a file_sd file
# within seconds, so replacing this file is the whole deployment step.
#
# It is written in the reference namespace on purpose. A committed list of
# plausible-looking internal hostnames is one copy-paste from being configured
# as real, and this platform's own endpoint policy refuses `.internal` names
# outright — so a list under that zone disagreed with the application that
# reads it.
# -----------------------------------------------------------------------------
# Probed from outside the application, over the real path a customer takes:
# DNS, load balancer, TLS termination, application. A synthetic check that
# skips any of those is a check of something no customer uses.
- targets:
    - https://portal.prod.example/up
  labels:
    service: customer-portal
    tier: customer-facing

- targets:
    - https://api.prod.example/up
  labels:
    service: public-api
    tier: customer-facing

- targets:
    - https://admin.prod.example/up
  labels:
    service: admin-portal
    tier: internal
