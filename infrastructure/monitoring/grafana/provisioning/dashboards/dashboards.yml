# Dashboard provider.
#
# Dashboards are files in git, not rows in Grafana's database. A dashboard that
# exists only in the database is lost with the volume, cannot be reviewed, and
# cannot be told apart from one somebody edited during an incident and forgot to
# change back.

apiVersion: 1

providers:
  - name: lynomia
    orgId: 1
    folder: Lynomia
    type: file
    # A dashboard deleted from git is deleted from Grafana. Without this, a
    # removed dashboard lingers forever, still queried and slowly rotting as the
    # metrics beneath it are renamed.
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
