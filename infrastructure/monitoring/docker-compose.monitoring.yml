# Lynomia Cloud — the monitoring stack.
#
# Run this on the monitoring host, NOT on a hypervisor and not on an
# application host. Monitoring that shares a machine with the thing it monitors
# goes down with it, and the one graph you need is the one you cannot reach.
#
# Every image is pinned to an exact tag. `latest` on a monitoring stack means
# the alerting rules silently change semantics on a Tuesday when someone runs
# `docker compose pull`, and the first sign of it is an alert that no longer
# fires.
#
# Exposure: every port is bound to 127.0.0.1. Prometheus serves every metric the
# platform has — capacity, customer counts, revenue — and Alertmanager can
# silence alerts, so neither is ever publicly reachable. Grafana is reached
# through the reverse proxy that terminates TLS and enforces SSO; publishing
# 3000 to the world would be publishing an unauthenticated read of all of it.
#
# See README.md in this directory for what to verify by hand after it starts.

name: lynomia-monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------------------
  # Prometheus — metrics store and rule evaluation.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: lynomia-prometheus
    restart: unless-stopped
    user: "65534:65534"
    <<: *hardening
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Thirty days of raw samples. Capacity trends that need longer belong in a
      # downsampled long-term store, not in a bigger local TSDB — the retention
      # that fills this volume is also the retention that loses all of it.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=60GB
      - --web.enable-lifecycle
      - --web.external-url=https://prometheus.lynomia.internal
      # Admin API stays off: it can delete series, and nothing in normal
      # operation needs it.
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - alertmanager

  # ---------------------------------------------------------------------------
  # Alertmanager — grouping, inhibition, routing, silences.
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: lynomia-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    <<: *hardening
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.lynomia.internal
      # Silences and the notification log must survive a restart. Without a
      # persistent volume, restarting Alertmanager re-notifies every firing
      # alert and drops every silence — during an incident, when both are
      # exactly what is holding the noise down.
      - --data.retention=120h
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Grafana — dashboards, provisioned from files so the stack is reproducible
  # from git. Nothing here is configured through the UI: a dashboard that only
  # exists in Grafana's database is a dashboard that disappears with the volume.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.1.1
    container_name: lynomia-grafana
    restart: unless-stopped
    user: "472:472"
    <<: *hardening
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.lynomia.internal
      # Anonymous access off, sign-up off. The dashboards show customer counts,
      # capacity and revenue; "internal network only" is not authentication.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Provisioned dashboards are read-only in the UI. Editing one in place
      # produces a change that is silently reverted on the next restart, which
      # is far more confusing than being told no.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 10s
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus
      - loki

  # ---------------------------------------------------------------------------
  # Loki — log store.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.5.7
    container_name: lynomia-loki
    restart: unless-stopped
    user: "10001:10001"
    <<: *hardening
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Grafana Alloy — log shipping. Promtail is NOT used: it is end-of-life.
  #
  # This instance ships the monitoring host's own logs. The control plane's log
  # is shipped by an Alloy running on each application host, deployed by the
  # Ansible monitoring role using the same config.alloy.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.11.2
    container_name: lynomia-alloy
    restart: unless-stopped
    <<: *hardening
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      LYNOMIA_ENV: ${LYNOMIA_ENV:-production}
      LYNOMIA_REGION: ${LYNOMIA_REGION:-kw-central}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only, and only the log directory. Alloy has no business with
      # anything else on the host, and a log shipper with a writable host mount
      # is a privilege escalation waiting for a CVE.
      - /var/log/lynomia:/var/log/lynomia:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - monitoring
    logging: *default-logging
    depends_on:
      - loki

  # ---------------------------------------------------------------------------
  # node_exporter — the monitoring host's own hardware metrics.
  #
  # Every other machine runs node_exporter natively via Ansible, not in Docker:
  # a containerised node_exporter reports the container's view of the world
  # unless it is given most of the host, at which point the container is only
  # pretending to be isolation.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: lynomia-node-exporter
    restart: unless-stopped
    <<: *hardening
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)
      # The textfile collector is how backup and SMART results reach Prometheus.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - node-exporter-textfile:/var/lib/node_exporter/textfile_collector:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # blackbox_exporter — probes the platform from outside itself.
  # ---------------------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: lynomia-blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The one capability granted anywhere in this file. ICMP probes need raw
    # sockets; without it the dedicated-server reachability checks silently
    # report every machine as down.
    cap_add:
      - NET_RAW
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - monitoring
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # prometheus-pve-exporter — Proxmox VE cluster, node and storage state.
  #
  # A proxy, scraped once per PVE host via a ?target= parameter. The PVE API
  # token lives in this container's config file and never reaches Prometheus,
  # so rotating it does not touch the scrape configuration.
  # ---------------------------------------------------------------------------
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.5.5
    container_name: lynomia-pve-exporter
    restart: unless-stopped
    <<: *hardening
    environment:
      PVE_CONFIG_FILE: /etc/pve-exporter/pve.yml
    volumes:
      - ./pve-exporter/pve.yml:/etc/pve-exporter/pve.yml:ro
    ports:
      - "127.0.0.1:9221:9221"
    networks:
      - monitoring
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # postgres_exporter — the control-plane database.
  #
  # Connects with a monitoring role that has pg_monitor and nothing else. A
  # superuser DSN here would put full write access to every customer record in
  # an environment variable on the monitoring host.
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: lynomia-postgres-exporter
    restart: unless-stopped
    <<: *hardening
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?set POSTGRES_EXPORTER_DSN}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - monitoring
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # redis_exporter — queue backend.
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    container_name: lynomia-redis-exporter
    restart: unless-stopped
    <<: *hardening
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:?set REDIS_EXPORTER_ADDR}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-}
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - monitoring
    logging: *default-logging

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  node-exporter-textfile:
