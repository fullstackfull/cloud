---
pxe_dhcp_package: dnsmasq
pxe_dhcp_service: dnsmasq
pxe_tftp_root: /srv/tftp

# The provisioning network. Declared per host, never discovered.
pxe_provisioning_cidr: ~
pxe_dhcp_range_start: ~
pxe_dhcp_range_end: ~
pxe_dhcp_lease_time: 10m

# THIS SERVER'S OWN ADDRESS ON THE PROVISIONING VLAN, and the only address the
# boot chain may name. It is declared per host and is NOT `ansible_host`:
# `ansible_host` is the management address, on a different network, so a boot
# URL built from it hands a machine on the provisioning VLAN a host it cannot
# route to — and the rules below open port 80 on
# `pxe_provisioning_interface` only, so even a routed management address would
# have the request dropped. The installer profiles and unattended answer files
# under `pxe_http_root` carry root password hashes and provisioning keys; the
# whole point of this VLAN is that they are reachable from it and from nowhere
# else. The role refuses unless this address is inside
# `pxe_provisioning_cidr`.
pxe_provisioning_address: ~

# Where installers fetch their images and answer files from. Served over HTTP
# on the provisioning VLAN only.
pxe_http_root: /srv/provisioning

# Every one of these is bound to the NAMED PROVISIONING INTERFACE rather than to
# a source network, and the DHCP port is here because without it the service
# runs and answers nothing.
#
# The hardening role builds a default-deny inbound ruleset on this host too. A
# PXE server whose port 67 is dropped by its own firewall boots nothing: the
# machine on the provisioning VLAN sends a DISCOVER, dnsmasq never sees it, and
# the failure looks like broken hardware or a bad cable rather than a firewall.
# Source-address matching cannot express this rule at all — a DISCOVER comes
# from 0.0.0.0, before the client has any address — which is why these carry an
# interface instead of a CIDR. `iface` also keeps TFTP and the installer HTTP
# root off the management network, where the default would otherwise have put
# them.
pxe_inbound_rules:
  - {port: 67, proto: udp, iface: "{{ pxe_provisioning_interface }}", comment: 'pxe: DHCP, provisioning VLAN only'}
  - {port: 69, proto: udp, iface: "{{ pxe_provisioning_interface }}", comment: 'pxe: TFTP, provisioning VLAN only'}
  - {port: 80, proto: tcp, iface: "{{ pxe_provisioning_interface }}", comment: 'pxe: installer images and answer files'}
