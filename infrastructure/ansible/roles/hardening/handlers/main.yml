---
# `reloaded`, not `restarted`. A reload re-reads the configuration without
# dropping the session the operator is running this play over — and if the new
# configuration is broken, they still have the shell to fix it from.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ (ansible_facts.os_family == 'Debian') | ternary('ssh', 'sshd') }}"
    state: reloaded
  become: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  become: true

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  become: true
