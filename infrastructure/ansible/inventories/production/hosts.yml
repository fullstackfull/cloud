---
# =============================================================================
# EXAMPLE INVENTORY — production
# =============================================================================
# This file is an EXAMPLE and describes no machine that exists. Every address is
# an RFC 5737 / RFC 3849 documentation range and every name ends in `.example`.
# See development/hosts.yml for the full rationale.
#
# The real production inventory does not live in this repository. It contains
# management addresses, BMC endpoints and the topology of the provider's own
# network — a map of everything worth attacking — and it belongs in a private
# inventory repository with its own access control. See infrastructure/README.md.
#
# -----------------------------------------------------------------------------
# Read the guard flags in this file as a whole: NOT ONE of them is set.
#
#   no `allow_reimage`          — the OPNsense role refuses on every host here
#   no `pxe_allow_serve_dhcp`   — the PXE role will not start DHCP
#   no `proxmox_cluster_join_enabled` — no node joins or forms a cluster
#   no `postgresql_allow_initdb`— no cluster is initialised over existing data
#
# That is the intended steady state. A production host acquires a destructive
# flag when an operator adds it for a specific, scheduled piece of work, and
# loses it again afterwards. A flag that lives permanently in the inventory is
# not a guard; it is a default with extra steps.
# -----------------------------------------------------------------------------

all:
  vars:
    lynomia_environment: production

  children:
    control_plane:
      hosts:
        cp-1.prod.example:
          ansible_host: 203.0.113.11
          # The scheduler runs on exactly one host. Not "the first one", not
          # "whichever is up": one named host, because Laravel's scheduler is a
          # per-minute cron entry and two of them run every recurring job
          # twice. For the billing run that means a second set of invoices.
          lynomia_scheduler_host: true
        cp-2.prod.example:
          ansible_host: 203.0.113.12
        cp-3.prod.example:
          ansible_host: 203.0.113.13

    database:
      hosts:
        db-1.prod.example:
          ansible_host: 203.0.113.21
          postgresql_role: primary
        db-2.prod.example:
          ansible_host: 203.0.113.22
          postgresql_role: replica

    redis:
      hosts:
        redis-1.prod.example:
          ansible_host: 203.0.113.31
          # This instance carries the queues. The role asserts its
          # maxmemory-policy is an eviction-free policy, because evicting a
          # queued job deletes a customer's paid provisioning silently: no
          # error, no failed job, no retry — the work simply never happens and
          # the first person to notice is the customer.
          redis_hosts_queues: true
        redis-2.prod.example:
          ansible_host: 203.0.113.32
          # Cache-only instance. It may evict, because a cache miss is a slow
          # request and nothing worse.
          redis_hosts_queues: false

    monitoring:
      hosts:
        mon-1.prod.example:
          ansible_host: 203.0.113.41

    proxmox:
      hosts:
        pve-1.prod.example:
          ansible_host: 203.0.113.51
          proxmox_management_interface: eno1
          proxmox_bridges:
            - name: vmbr0
              interface: eno1
              vlan_aware: true
              comment: customer traffic
            - name: vmbr1
              interface: eno2
              vlan_aware: false
              comment: storage backend
        pve-2.prod.example:
          ansible_host: 203.0.113.52
          proxmox_management_interface: eno1
          proxmox_bridges:
            - name: vmbr0
              interface: eno1
              vlan_aware: true
              comment: customer traffic
            - name: vmbr1
              interface: eno2
              vlan_aware: false
              comment: storage backend

    pbs:
      hosts:
        pbs-1.prod.example:
          ansible_host: 203.0.113.61
          pbs_datastores:
            - name: vm-backups
              path: /mnt/datastore/vm-backups
              prune:
                keep_daily: 14
                keep_weekly: 8
                keep_monthly: 12
                keep_yearly: 2

    hosting:
      hosts:
        web-1.prod.example:
          ansible_host: 203.0.113.71
          hosting_panel: cpanel
        web-2.prod.example:
          ansible_host: 203.0.113.72
          hosting_panel: directadmin

    # Inventory only. No play targets this group; see staging/hosts.yml.
    dedicated:
      hosts:
        dedi-1.prod.example:
          ansible_host: 203.0.113.81
          # No play targets this group. The flag is what every role's
          # opening guard checks, so even an explicit `-l` against this
          # host is refused before anything is written.
          lynomia_never_configure: true

    pxe:
      hosts:
        pxe-1.prod.example:
          ansible_host: 203.0.113.91
          pxe_provisioning_interface: eno2
          pxe_provisioning_cidr: 192.0.2.0/24
          pxe_dhcp_range_start: 192.0.2.100
          pxe_dhcp_range_end: 192.0.2.200
          # `pxe_allow_serve_dhcp` is absent. The iPXE and TFTP configuration is
          # still managed and still reviewable in --diff; the DHCP service is
          # what stays stopped until someone turns it on deliberately.

    firewall:
      hosts:
        fw-1.prod.example:
          ansible_host: 203.0.113.1
          lynomia_role: firewall
          # `allow_reimage` is absent, so playbooks/firewall.yml refuses on this
          # host. Restoring it is a scheduled maintenance decision with a
          # console path already open, not a line someone leaves committed.
