---
# =============================================================================
# EXAMPLE INVENTORY — staging
# =============================================================================
# This file is an EXAMPLE and describes no machine that exists. Addresses are
# RFC 5737 / RFC 3849 documentation ranges and names end in `.example`, so a
# copied placeholder fails to connect rather than configuring someone else's
# host. See development/hosts.yml for the full rationale.
#
# Staging runs the REAL provider adapters against test infrastructure
# (docs/deployment.md). A staging environment running fakes verifies nothing
# about the code path that actually matters, so staging has a hypervisor and a
# backup server — and, because it has those, it also has the guard flags that
# keep automation away from them.

all:
  vars:
    lynomia_environment: staging

  children:
    control_plane:
      hosts:
        cp-stg-1.stg.example:
          ansible_host: 198.51.100.11
          lynomia_scheduler_host: true
        cp-stg-2.stg.example:
          ansible_host: 198.51.100.12
          # Deliberately absent rather than `false`: the scheduler assertion
          # counts hosts where the flag is true. Two hosts with `true` is the
          # failure it exists to catch — the scheduler firing twice a minute
          # dispatches every recurring job twice, and "twice" for a billing
          # run means invoicing a customer twice.

    database:
      hosts:
        db-stg-1.stg.example:
          ansible_host: 198.51.100.21
          postgresql_role: primary
        db-stg-2.stg.example:
          ansible_host: 198.51.100.22
          postgresql_role: replica

    redis:
      hosts:
        redis-stg-1.stg.example:
          ansible_host: 198.51.100.31
          redis_hosts_queues: true

    monitoring:
      hosts:
        mon-stg-1.stg.example:
          ansible_host: 198.51.100.41

    proxmox:
      hosts:
        pve-stg-1.stg.example:
          ansible_host: 198.51.100.51
          proxmox_management_interface: eno1
          proxmox_bridges:
            - name: vmbr0
              interface: eno1
              vlan_aware: true
              comment: customer traffic, VLAN-tagged per service
            - name: vmbr1
              interface: eno2
              vlan_aware: false
              comment: storage backend, untagged
          # NO `proxmox_cluster_join_enabled` key. Cluster join happens only where it is
          # declared for that specific host, with the cluster it is joining
          # named in full. Joining the wrong cluster is not recoverable without
          # downtime for every node already in the target cluster, so the
          # automation treats "no declaration" as "do not join" and never as
          # "join the one everybody else is in".

    pbs:
      hosts:
        pbs-stg-1.stg.example:
          ansible_host: 198.51.100.61
          pbs_datastores:
            - name: staging-vm-backups
              path: /mnt/datastore/staging-vm-backups
              # Retention here must match what the plan sold. A plan
              # advertising thirty days configured for seven is a promise the
              # platform fails to keep at the worst possible moment.
              prune:
                keep_daily: 7
                keep_weekly: 4
                keep_monthly: 3

    hosting:
      hosts:
        web-stg-1.stg.example:
          ansible_host: 198.51.100.71
          hosting_panel: cpanel

    # `dedicated` is inventory ONLY. These rows exist so that monitoring and
    # documentation can name the machines; no play in this repository targets
    # this group, and none ever should. A customer's dedicated server runs the
    # customer's operating system, and platform automation has no business on it.
    dedicated:
      hosts:
        dedi-stg-1.stg.example:
          ansible_host: 198.51.100.81
          # No play targets this group. The flag is what every role's
          # opening guard checks, so even an explicit `-l` against this
          # host is refused before anything is written.
          lynomia_never_configure: true

    # PXE and firewall groups exist in staging so the guards can be rehearsed
    # here rather than discovered in production.
    pxe:
      hosts:
        pxe-stg-1.stg.example:
          ansible_host: 198.51.100.91
          # DHCP and TFTP bind to this interface and no other. The interface is
          # named, not discovered: a PXE server that picks "the default route's
          # interface" is one cabling change away from answering DHCP on the
          # customer LAN and reinstalling whatever reboots there.
          pxe_provisioning_interface: eno2
          pxe_provisioning_cidr: 203.0.113.0/24
          pxe_dhcp_range_start: 203.0.113.100
          pxe_dhcp_range_end: 203.0.113.200
          pxe_allow_serve_dhcp: true

    firewall:
      hosts:
        fw-stg-1.stg.example:
          ansible_host: 198.51.100.1
          lynomia_role: firewall
          # BOTH flags are required by the OPNsense role, and neither has a
          # default. `role: firewall` says what the machine is; `allow_reimage`
          # says an operator has accepted that a mistake here disconnects the
          # datacentre including the management path used to fix it.
          #
          # `allow_reimage` IS NOT SET HERE, AND MUST NOT BE. It is an
          # authorisation for one scheduled piece of work, not a property of the
          # machine — production/hosts.yml says exactly that, and an example
          # that ships it committed is an example somebody copies into a real
          # inventory along with a permanently armed edge firewall. Arm it in
          # `inventories/staging/host_vars/fw-stg-1.stg.example/maintenance.yml`
          # for the window, and delete the file afterwards:
          #
          #   allow_reimage: true
          #   opnsense_console_access_confirmed: true
          #
          # host_vars sits above ansible/group_vars in the precedence order, so
          # that one file is enough and no group can do it for a whole
          # environment. Without it the role refuses on this host, which is the
          # steady state.
