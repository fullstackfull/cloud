---
# =============================================================================
# EXAMPLE INVENTORY — development
# =============================================================================
# This file is an EXAMPLE. It is committed so that the layout, the group names
# and the guard flags are reviewable, and so `--syntax-check` has something to
# parse. It does not describe any machine that exists.
#
# Every address below is from a range reserved by the RFCs for documentation:
#
#   192.0.2.0/24     RFC 5737 TEST-NET-1
#   198.51.100.0/24  RFC 5737 TEST-NET-2
#   203.0.113.0/24   RFC 5737 TEST-NET-3
#   2001:db8::/32    RFC 3849 documentation prefix
#
# and every name ends in `.example` or `.invalid`, which RFC 2606 and RFC 6761
# guarantee will never be delegated. None of them route anywhere. That is the
# point: a copied example that still contains a placeholder fails to connect
# instead of configuring a stranger's machine.
#
# To use this for real, copy the tree to a private inventory repository and
# replace the addresses. Do not edit this file with real values — see
# infrastructure/README.md, "Inventories are examples".
#
# -----------------------------------------------------------------------------
# Development is a developer's machine. It runs the control plane against fake
# providers (docs/deployment.md), so there is deliberately NO hypervisor, NO
# PXE server and NO firewall group here. A development inventory that contained
# a `firewall` group would be one `-i` typo away from reconfiguring a real one.
# -----------------------------------------------------------------------------

all:
  vars:
    lynomia_environment: development

  children:
    control_plane:
      hosts:
        cp-dev-1.dev.example:
          ansible_host: 192.0.2.11
          # Exactly one control-plane host may run the scheduler. In
          # development there is only one host, so this is trivially true —
          # but the flag is still explicit, because the assertion that
          # enforces "exactly one" runs in every environment and a group with
          # no scheduler host is as broken as a group with two.
          lynomia_scheduler_host: true

    database:
      hosts:
        db-dev-1.dev.example:
          ansible_host: 192.0.2.21

    redis:
      hosts:
        redis-dev-1.dev.example:
          ansible_host: 192.0.2.31
          # The development Redis is a single instance doing every job. It is
          # still declared as the queue instance, because the eviction-policy
          # assertion must fail in development too — that is where a bad
          # default gets noticed cheaply.
          redis_hosts_queues: true

    monitoring:
      hosts:
        mon-dev-1.dev.example:
          ansible_host: 192.0.2.41
