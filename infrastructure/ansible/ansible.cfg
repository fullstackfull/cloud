# Lynomia Cloud — Ansible configuration.
#
# Everything here is a safety default rather than a convenience default. The
# hosts this repository touches include hypervisors running customer machines,
# the firewall that carries the management path, and a PXE server that can
# reinstall whatever reboots in front of it. A setting that makes a careless run
# easier is a setting that makes a careless run destructive.

[defaults]
inventory              = inventories/development
roles_path             = roles
collections_path       = ./.ansible/collections
interpreter_python     = auto_silent
forks                  = 10
stdout_callback        = default
display_skipped_hosts  = false

# Readable multi-line task results WITHOUT the community.general `yaml` callback.
# That callback moved out of ansible-core, so naming it here would make every
# run depend on a Galaxy install — and a fleet whose configuration management
# cannot start until it has downloaded something is a fleet that cannot be fixed
# on the day the network is what is broken. Nothing in this repository requires
# a collection outside ansible-core.
result_format          = yaml

# Facts are cached on the controller because the read-only preflight, the
# hardening pass and the role playbooks all gather the same facts within
# minutes of each other, and re-running setup against a fleet of hypervisors is
# the slowest part of every play.
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.ansible/facts
fact_caching_timeout    = 3600

# Retry files name hosts, and hosts here are production infrastructure. A
# .retry file left in the working tree is an inventory fragment nobody meant to
# write down.
retry_files_enabled = false

# The whole platform's convention is that a task announces what it is about to
# do before it does it. An unnamed task in a --check run is unreadable, and a
# --check run nobody can read is a --check run nobody performs.
force_valid_group_names = ignore

# Deprecation noise trains operators to skim Ansible output. The one class of
# message that must never be skimmed is a guard refusing to run.
deprecation_warnings = false

# No vault password is configured here on purpose: see infrastructure/README.md.
# Committing a vault_password_file path that resolves on a developer's laptop is
# how a fleet ends up with one shared vault password that nobody can rotate.

[inventory]
# An inventory that fails to parse must stop the run. The default is a warning,
# which means a typo in a group name silently produces an empty host list — and
# a play that targets nothing reports success.
unparsed_is_failed = true
any_unparsed_is_failed = true

[privilege_escalation]
become        = false
become_method = sudo
become_user   = root
# become is opted into per play, never globally. Most of what runs here is
# inspection, and inspection does not need root.

[ssh_connection]
pipelining = true
# ControlPersist keeps one connection per host for the length of a play. Without
# it a role with sixty tasks opens sixty SSH sessions, and fail2ban on a
# hardened host will eventually treat the controller as an attacker.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
control_path_dir = ./.ansible/cp

[persistent_connection]
command_timeout = 60
connect_timeout = 60
