---
# =============================================================================
# hardening.yml — SSH keys only, fail2ban, nftables default-deny inbound.
# =============================================================================
#
# THIS PLAYBOOK CAN LOCK YOU OUT. It disables password authentication and builds
# a default-deny inbound ruleset. The role refuses to run at all if no
# management network is declared or no public key is supplied — but the run that
# succeeds with the WRONG management network is the one to be careful about.
#
# Run it against one host first, and keep the session you ran it from open until
# you have opened a second one:
#
#   ansible-playbook -i inventories/staging playbooks/hardening.yml \
#       --limit <one host> --check --diff
#   ansible-playbook -i inventories/staging playbooks/hardening.yml \
#       --limit <one host> --diff
#
# `--diff` on this playbook is worth reading line by line: it shows exactly
# which keys are being installed and exactly which networks will still be able
# to reach port 22.

# IT ALSO DOES NOT KNOW WHICH PORTS A HOST SERVES.
#
# Unlike control-plane.yml, database.yml, redis.yml, monitoring.yml,
# proxmox-postinstall.yml, pbs-configure.yml and pxe.yml, this play collects no
# `*_inbound_rules` before applying the role — it cannot, because it does not
# apply the roles that own them. The hardening role writes a COMPLETE ruleset,
# so running it here against a host that serves anything would replace that
# host's exceptions with none: 443 on the API, 5432 on the database, 8006 on the
# hypervisors, 9100 everywhere at once.
#
# roles/hardening therefore refuses on any host in `hardening_service_groups`
# that reaches it with an empty exception list. Those hosts are hardened by the
# playbook that owns them, which does the same SSH, fail2ban and nftables work
# with their ports collected first. What is left for this playbook is a host in
# no service group at all.

- name: Harden platform hosts
  hosts: all:!dedicated:!firewall
  gather_facts: true
  become: true

  # One host at a time. A mistake in the ruleset that locks out the fleet is
  # unrecoverable at scale; the same mistake on one host is a console session.
  serial: 1

  # And stop the moment one host fails, rather than working through the rest
  # with a ruleset that has already been shown to be wrong.
  any_errors_fatal: true

  pre_tasks:
    - name: Load the Vault-encrypted secrets for this environment
      ansible.builtin.include_vars:
        file: "{{ vault_file }}"
      loop: "{{ query('first_found', [lynomia_vault_file], errors='ignore') }}"
      loop_control:
        loop_var: vault_file
      no_log: true

  roles:
    # Refuse the machine before doing anything to it.
    - role: safety_gate
      vars:
        safety_gate_action: configure
    - role: common
    - role: hardening
