        id:
          "$ref": "#/components/schemas/Ulid"
        name:
          type: "string"
        mime_type:
          type: "string"
          description: "Decided from the bytes at upload, never from what the client claimed."
        size_bytes:
          type: "integer"
    TicketMessage:
      type: "object"
      additionalProperties: false
      description: "One thing somebody said. `is_internal_note` is always false on the customer surface — notes are excluded by the query rather than by this field."
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        author:
          type:
            - "string"
            - "null"
          description: "A name. Null for a message the platform wrote itself."
        author_kind:
          type: "string"
          description: "customer, operator or system."
        body:
