          headers:
            Retry-After:
              "$ref": "#/components/headers/RetryAfter"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/webhooks/{provider}":
    post:
      operationId: "webhooks_receive"
      tags:
        - "Webhooks"
      summary: "Receive a provider webhook"
      description: |-
        Called by the payment provider, not by a client. Outside the versioned
        API on purpose: the shape is the provider's, and it must never sit
        behind the session or CSRF middleware the portals use.

        The signature is verified before the body is parsed, and an event
        already seen is acknowledged without being applied again — a provider
        that delivers ten times must not settle an invoice ten times.
      parameters:
        - name: "provider"
          in: "path"
          required: true
          schema:
            type: "string"
      security: []
      responses:
        204:
          description: "No content."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimitRemaining"
        404:
          description: "Not found. An identifier belonging to another account answers this rather than 403: a 403 confirms the id exists, which over a loop is an inventory of the platform."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        429:
          description: "Rate limited. `Retry-After` says how long to wait."
          headers:
            Retry-After:
              "$ref": "#/components/headers/RetryAfter"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "lynomia_session"
      description: |-
        The portal's own authentication: a Sanctum cookie session.

        The cookie is HttpOnly, so no script on the page can read it — which
        is the whole reason the portal does not use a bearer token. Every
        mutating request must also carry `X-XSRF-TOKEN`, read from the
        `XSRF-TOKEN` cookie that `GET /sanctum/csrf-cookie` sets.

        Intended for the first-party portal. An integration should use a
        personal access token instead.
    personalAccessToken:
      type: "http"
      scheme: "bearer"
      description: |-
        A personal access token, created at `POST /api/v1/me/api-tokens`.

        Shown once, at creation, and never again — the platform stores only
        a hash. A token carries abilities and, optionally, its own rate
        limit and expiry; a request outside a token's abilities is refused
        with `auth.forbidden` rather than silently narrowed.

        A token scoped to one billing account decides which account the
        request acts on, and an `X-Customer-Id` header naming a different
        one is refused rather than obeyed.
  parameters:
    page:
      name: "page"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 1
    perPage:
      name: "per_page"
      in: "query"
      required: false
      description: "Clamped to the collection's maximum rather than refused."
      schema:
        type: "integer"
        minimum: 1
        default: 25
    customerId:
      name: "X-Customer-Id"
      in: "header"
      required: false
      description: |-
        Which billing account to act on, for a principal that belongs to
        more than one.

        Omit it and the platform uses the sole account you belong to; send
        it with more than one membership and it selects. Membership is
        re-checked on every request, so a header naming an account you have
        left is refused. A token already scoped to an account wins: a
        header naming a different one is refused rather than obeyed.
      schema:
        type: "string"
        pattern: "^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$"
    idempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: |-
        Makes a repeat of this request safe.

        A retry carrying the same key returns the first result rather than
        performing the operation again. Without one, a client that retries
        after a timeout may cause the operation twice — and for anything
        that reaches a provider, twice means a second machine, a second
        charge, or a second backup running over the same disks.
      schema:
        type: "string"
        maxLength: 255
  headers:
    RateLimitRemaining:
      description: "Requests left in the current window."
      schema:
        type: "integer"
    RetryAfter:
      description: "Seconds to wait before retrying. Present on 429."
      schema:
        type: "integer"
    RequestId:
      description: "Correlates this response with the platform's logs. On every response."
      schema:
        type: "string"
  schemas:
    AcceptedInvitation:
      type: "object"
      additionalProperties: false
      description: "The membership that acceptance produced."
      properties:
        customer_id:
          "$ref": "#/components/schemas/Ulid"
        role:
          type: "string"
    AcceptedInvitationResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/AcceptedInvitation"
    AccountOverview:
      type: "object"
      additionalProperties: true
      description: "The dashboard in one read: attention items in server-decided priority order, a service summary, money owed grouped by currency, upcoming renewals, the unread count, and recent services and activity. Money is never summed across currencies — an account billed in two has two amounts owing, and a single total would be arithmetic nobody can perform."
      properties:
        attention:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
          description: "Ordered by severity, then how long it has been true, then a stable id. Ordered by the server so an Arabic dashboard and an English one agree, and capped so a first page cannot become a billing history."
        services:
          type: "object"
          additionalProperties: true
        billing:
          type: "object"
          additionalProperties: true
          description: "{due: [{invoices, amount}]} — one entry per currency, and no total."
        renewals:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
          description: "Amount is null where the platform has no authoritative one: a domain's renewal price comes from the catalogue at renewal time, and printing one here would be quoting a guess."
        unread_notifications:
          type: "integer"
        recent:
          type: "object"
          additionalProperties: true
          description: "A few services, and the newest activity rows — from the same account feed as /activity, so the dashboard has no history logic of its own."
    AccountOverviewResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/AccountOverview"
    ActivityItem:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          description: "source:rowId — unique across the sources the feed unions, and the cursor's tie-breaker. Opaque to clients."
        occurred_at:
          "$ref": "#/components/schemas/Timestamp"
        category:
          type: "string"
          enum:
            - "cloud"
            - "hosting"
            - "domains"
            - "billing"
            - "support"
            - "backups"
          description: "The part of the account this belongs to. The only values ?category= accepts, and the filter chooses which sources are read rather than trimming a page."
        message_code:
          type: "string"
          description: "A translation key, not a sentence: the server says what happened and the client says it in the reader's language."
