# The meaning lives in resources/openapi/; this file is its serialisation.
openapi: "3.1.0"
info:
  title: "Lynomia Cloud API"
  version: "1.0.0"
  summary: "Cloud VPS, dedicated servers and shared hosting, with their billing."
  description: |-
    This document is generated from the route table of the running
    application. It cannot describe an endpoint that does not exist,
    and the build fails if an endpoint exists that it does not describe.

    ## What every response looks like

    A single resource comes back as `{"data": {…}}`. A collection comes
    back as `{"data": […], "meta": {…}}` with the same paging envelope
    everywhere. A failure comes back as `{"error": {"code", "message",
    …}}` — branch on the code, never on the status or the prose.

    ## Money

    Integer minor units and a currency, never a float. The `amount`
    string is for display and must not be parsed back into arithmetic.

    ## Which account a request acts on

    A principal may belong to several billing accounts. Send
    `X-Customer-Id` to choose; omit it if you belong to one. A token
    already scoped to an account wins over the header. Membership is
    re-checked on every request.

    ## Retries

    Anything that reaches a provider — placing an order, taking a
    backup, changing power — should carry an `Idempotency-Key`. A
    timeout on this API means the platform stopped waiting, not that
    the provider stopped working: retrying without a key is how a
    customer ends up with two machines, or two charges.

    ## Rate limits

    Every authenticated route is limited, and the operations that cost
    real money or real hardware are limited far below the general
    ceiling. A 429 carries `Retry-After`.

    ## Not described here

    There is no support-ticket API, no DNS zone management API and no
    restore or delete for backups. Each is absent because it is not
    implemented, not because it is undocumented — see
    docs/build-status.md.
