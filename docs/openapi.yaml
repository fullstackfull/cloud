  - name: "Activity"
  - name: "Authentication"
    description: "Signing in and out, verifying an address, resetting a password. Rate-limited harder than anything else here."
  - name: "Backups"
    description: "Backups of a machine. A state moves to succeeded only when the provider says the task finished, never because a job was accepted."
  - name: "Billing"
    description: "Invoices, subscriptions, payments and the wallet. Money is integer minor units throughout."
  - name: "Catalogue"
    description: "What is for sale, priced in the account's currency."
  - name: "Cloud VPS"
    description: "Virtual machines: their state, their power, their console and their reinstalls."
  - name: "DNS"
  - name: "Dedicated servers"
    description: "Physical machines, controlled through a BMC the API never exposes."
  - name: "Domains"
  - name: "IP addresses"
    description: "Addresses assigned to the account, and their reverse DNS."
  - name: "Notifications"
    description: "What the platform has told this customer, and what they have read. Security and billing messages cannot be switched off."
  - name: "Operator"
    description: "The NOC surface. Same guard as the customer API — what separates them is that every route here names the permission it needs."
  - name: "Orders"
    description: "Placing and cancelling orders. Nothing is provisioned until a payment has been verified server-side."
  - name: "Payments"
  - name: "Services"
    description: "What the account owns, whatever kind it is, and what the platform has done to it."
  - name: "Shared hosting"
    description: "Panel accounts, their usage, and single-use sign-in links to the panel."
  - name: "Support"
    description: "Tickets between an account and the support team. A customer may open, reply and close; resolving is the team's judgement and is not on this surface. Internal notes never appear here at all."
  - name: "Team"
    description: "Who belongs to this account and what each of them may do. The three /invitations routes are the invitee's side, and are the only customer routes that work for somebody who belongs to no account yet."
  - name: "Webhooks"
    description: "Called by providers, not by clients. Signature-verified before the body is parsed."
  - name: "WordPress"
