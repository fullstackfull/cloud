        created_at:
          "$ref": "#/components/schemas/Timestamp"
    TicketResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Ticket"
    Timestamp:
      type:
        - "string"
        - "null"
      format: "date-time"
      description: "ISO 8601 with an offset. Always UTC on the wire."
    TwoFactorSetup:
