    WordPressCopySupport:
      type: "object"
      additionalProperties: false
      description: "What this site's panel toolkit can do with it right now, and the reason when nothing."
      properties:
        staging:
          type: "boolean"
        clone:
          type: "boolean"
        push_to_production:
          type: "boolean"
        reason:
          type:
            - "string"
            - "null"
    WordPressPushImpact:
      type: "object"
      additionalProperties: false
      properties:
        staging_domain:
          type: "string"
        production_domain:
          type: "string"
        scope:
          type: "string"
        copy_made_at:
          "$ref": "#/components/schemas/Timestamp"
        production_verified_at:
          "$ref": "#/components/schemas/Timestamp"
        platform_backup:
          type: "null"
          description: "Always null: this platform holds no backup of a shared-hosting site, and says so rather than implying one."
        warnings:
          type: "array"
          items:
            type: "string"
    WordPressPushImpactResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/WordPressPushImpact"
    WordPressSite:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        domain:
          type:
            - "string"
            - "null"
        domain_source:
          type:
            - "string"
            - "null"
          description: "register, existing, transfer or external. It decides what the platform is waiting for: a name it delegates itself takes seconds, a transfer takes up to five days, and an external one waits on the customer changing DNS at another company."
        domain_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        state:
          type:
            - "string"
            - "null"
          description: "requested, awaiting_dns, installing, awaiting_certificate, ready, failed, indeterminate, needs_review or removed. `indeterminate` means an installer stopped answering and WordPress may or may not be there — it is never resolved by installing again, because a second install writes over whatever the customer already put on the site."
        is_usable:
          type: "boolean"
          description: "True for `awaiting_certificate` as well as `ready`: the site is serving and the padlock is what is missing."
        is_verified:
          type: "boolean"
          description: "True only when this platform fetched the site and WordPress answered. Every other field here is somebody else's report; this one is the platform having looked."
        needs_attention:
          type: "boolean"
        dns_ready:
          type: "boolean"
        installed:
          type: "boolean"
        ssl_status:
          type:
            - "string"
            - "null"
        site_url:
          type:
            - "string"
            - "null"
        admin_url:
          type:
            - "string"
            - "null"
        admin_username:
          type:
            - "string"
            - "null"
        wordpress_version:
          type:
            - "string"
            - "null"
        locale:
          type:
            - "string"
            - "null"
        failure_reason:
          type:
            - "string"
            - "null"
          description: "Whether the last operation failed, said in the language the request asked for. The panel's own words stay with support."
        hosting_account_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        verified_at:
          "$ref": "#/components/schemas/Timestamp"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        kind:
          type: "string"
          enum:
            - "production"
            - "staging"
            - "clone"
          description: "A staging copy belongs to its parent and is the only kind that can be pushed back; a clone is a production site that started as a copy."
        parent_site_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        copies:
          "$ref": "#/components/schemas/WordPressCopySupport"
    WordPressSiteOperation:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        site_id:
          "$ref": "#/components/schemas/Ulid"
        target_site_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        kind:
          type: "string"
          enum:
            - "create_staging"
            - "clone"
            - "push_to_production"
        state:
          type:
            - "string"
            - "null"
          description: "requested, running, succeeded, failed or indeterminate. `indeterminate` is a toolkit that did not answer; for a push, production may be half-overwritten, and it is never retried."
        is_in_flight:
          type: "boolean"
        needs_attention:
          type: "boolean"
        scope:
          type:
            - "string"
            - "null"
          enum:
            - "files"
            - "database"
            - "both"
            - null
        impact:
          oneOf:
            - "$ref": "#/components/schemas/WordPressPushImpact"
            - type: "null"
        failure_reason:
          type:
            - "string"
            - "null"
        started_at:
          "$ref": "#/components/schemas/Timestamp"
        finished_at:
          "$ref": "#/components/schemas/Timestamp"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    WordPressSiteOperationPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/WordPressSiteOperation"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    WordPressSiteOperationResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/WordPressSiteOperation"
    WordPressSiteResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/WordPressSite"
    ZoneExport:
