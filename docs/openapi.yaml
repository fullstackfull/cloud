        id:
          "$ref": "#/components/schemas/Ulid"
        email:
          type: "string"
        role:
          type: "string"
        status:
          type: "string"
          description: "pending, accepted, declined, revoked or expired. Derived from the timestamps rather than stored, so there is no second copy to disagree with them."
        invited_by:
          type:
            - "string"
            - "null"
        invited_at:
          "$ref": "#/components/schemas/Timestamp"
        expires_at:
          "$ref": "#/components/schemas/Timestamp"
        sent_count:
          type: "integer"
        last_sent_at:
          "$ref": "#/components/schemas/Timestamp"
    TeamInvitationResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/TeamInvitation"
    TeamMember:
      type: "object"
      additionalProperties: false
      description: "One colleague, as their colleagues may see them. Name and address are here because a team screen without them names nobody; nothing else of the user row is, because whether somebody has two-factor on is their own security question and not a field on a list every member can read."
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        name:
          type:
            - "string"
            - "null"
        email:
          type:
            - "string"
            - "null"
        role:
          type: "string"
          description: "owner, administrator, billing, technical or member. `member` is the read-only tier."
        invited_by:
          type:
            - "string"
            - "null"
          description: "A name rather than a user id: the question is who let them in, not which row."
        invited_at:
          "$ref": "#/components/schemas/Timestamp"
        joined_at:
          "$ref": "#/components/schemas/Timestamp"
    TeamMemberResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/TeamMember"
    Ticket:
      type: "object"
      additionalProperties: false
      description: "One support conversation, as the account that raised it may see it. `first_responded_at` is deliberately absent: it is how the support team is measured, not something the customer asked about."
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        reference:
