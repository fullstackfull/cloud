            - "null"
        billing_period:
          type:
            - "string"
            - "null"
        recurring_amount:
          "$ref": "#/components/schemas/Money"
        plan_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        order_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        plan:
          type:
            - "object"
            - "null"
          additionalProperties: true
        product:
          type:
            - "object"
            - "null"
          additionalProperties: true
        services:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
        current_period_start:
