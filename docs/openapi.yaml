        state:
          type:
            - "string"
            - "null"
        safety:
          type:
            - "object"
            - "null"
          additionalProperties: true
        classification:
          type:
            - "string"
            - "null"
          enum:
            - "do_not_touch"
            - "discovery_only"
            - "configuration_allowed"
            - "reimage_allowed"
