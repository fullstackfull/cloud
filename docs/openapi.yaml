    Money:
      type: "object"
      description: |-
        An exact amount. Never a floating point number, in either direction.

        `minor_units` is the authoritative field and is an integer: 9000 fils, not
        9.0 dinars. `amount` is a decimal *string* for display, and must not be
        parsed into a double and fed back into arithmetic — a KWD total beyond a
        few million fils starts losing precision as a double, and an invoice wrong
        by one fil is an invoice the customer is right to dispute.
      required:
        - "minor_units"
        - "currency"
        - "amount"
      additionalProperties: false
      properties:
        minor_units:
          type: "integer"
          examples:
            - 9000
        currency:
          type: "string"
          minLength: 3
          maxLength: 3
          examples:
            - "KWD"
        amount:
          type: "string"
          examples:
            - "9.000"
    Notification:
      type: "object"
      additionalProperties: false
      description: "One thing the platform told this customer. Title and body are rendered per request in the caller's language: the row stores facts, not prose, so a customer who switches to Arabic sees their whole history in Arabic."
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        type:
          type:
            - "string"
            - "null"
        category:
          type:
            - "string"
            - "null"
          description: "security and billing cannot be silenced; service and operational can be, by email only."
        title:
          type:
            - "string"
            - "null"
        body:
          type:
            - "string"
            - "null"
        is_failure:
          type: "boolean"
        link:
          type:
            - "string"
            - "null"
          description: "A portal path, not a URL, so it stays correct when the host changes. A collection path: the resource below is the precise destination where there is one."
        resource:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "What this notification is about, as `{kind, id}` — resolved from the notification's stored subject, never inferred from its text. `kind` is a customer-facing family (`vps`, `dedicated`, `hosting`, `wordpress`, `invoice`), and the client owns the route it maps to. Null where the subject has no page of its own."
        kind:
          type:
            - "string"
            - "null"
        read_at:
          "$ref": "#/components/schemas/Timestamp"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    NotificationPage:
      type: "object"
      required:
        - "data"
