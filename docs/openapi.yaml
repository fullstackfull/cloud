  "/api/admin/services/{service}":
    delete:
      operationId: "api_admin_services_terminate"
      tags:
        - "Operator"
      summary: "End a service and destroy its machine"
      description: |-
        The one act on this surface that destroys data. The retention window on a suspended service is enforced by the action, not by the caller: most suspensions are billing disputes that end with the customer paying. `force` skips it for an abuse case or a right-to-erasure request, needs the terminate permission checked a second time, and is recorded as forced. Answers 202. For a VPS the machine is destroyed by a worker, and the service reaches `terminated` when that worker succeeds, releasing the address into quarantine and the capacity back to the node. For a dedicated server nothing is queued: the machine leaves the customer and is held in `maintenance` until an operator states its disks have been erased, because no call this platform can make proves that they were.

        Requires the `service.terminate` permission.
      parameters:
        - name: "service"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/customerId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                reason:
                  description: "See the endpoint description; validated server-side."
                force:
                  description: "See the endpoint description; validated server-side."
      security:
        - sessionCookie: []
        - personalAccessToken: []
      responses:
