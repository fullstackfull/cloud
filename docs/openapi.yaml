        priority:
          type: "string"
        service_id:
          type:
            - "string"
            - "null"
        invoice_id:
          type:
            - "string"
            - "null"
        assigned_to:
          type:
            - "string"
            - "null"
          description: "A name, not a user id."
        opened_by:
          type:
            - "string"
            - "null"
        last_reply_at:
          "$ref": "#/components/schemas/Timestamp"
        last_reply_by:
          type:
            - "string"
            - "null"
        awaiting_customer:
          type: "boolean"
        resolved_at:
          "$ref": "#/components/schemas/Timestamp"
        closed_at:
          "$ref": "#/components/schemas/Timestamp"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
        messages:
          type: "array"
          items:
            "$ref": "#/components/schemas/TicketMessage"
    TicketAttachment:
      type: "object"
