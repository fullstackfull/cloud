        permits:
          type:
            - "object"
            - "null"
          additionalProperties: true
        read:
          type: "boolean"
        configure:
          type: "boolean"
        reimage:
          type: "boolean"
        location:
          type:
            - "object"
            - "null"
          additionalProperties: true
        datacenter_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        rack_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        rack_unit:
          type:
            - "integer"
            - "null"
        height_units:
          type:
            - "integer"
            - "null"
        hardware:
          type:
            - "object"
            - "null"
          additionalProperties: true
        vendor:
          type:
            - "string"
            - "null"
        model:
          type:
            - "string"
            - "null"
        serial:
          type:
            - "string"
            - "null"
        asset_tag:
          type:
            - "string"
            - "null"
        operating_system:
          type:
            - "string"
            - "null"
        connection:
          type:
            - "object"
            - "null"
          additionalProperties: true
        blocker:
          type:
            - "string"
            - "null"
        management_address:
          type:
            - "string"
            - "null"
        bmc_address:
          type:
            - "string"
            - "null"
        credential:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "Which credential is used, never the credential. No endpoint on this API returns a secret."
        last_tested_at:
          "$ref": "#/components/schemas/Timestamp"
        last_discovery_at:
          "$ref": "#/components/schemas/Timestamp"
        last_deployment_at:
          "$ref": "#/components/schemas/Timestamp"
        last_verification_at:
          "$ref": "#/components/schemas/Timestamp"
        notes:
          type:
            - "string"
            - "null"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    ServerComponent:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type:
            - "string"
            - "null"
        model:
          type:
            - "string"
            - "null"
        quantity:
          type:
            - "integer"
            - "null"
        health:
