        - "$ref": "#/components/parameters/customerId"
        - "$ref": "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                lines:
                  description: "See the endpoint description; validated server-side."
                billing_period:
                  description: "See the endpoint description; validated server-side."
                coupon_code:
                  description: "See the endpoint description; validated server-side."
                notes:
                  description: "See the endpoint description; validated server-side."
