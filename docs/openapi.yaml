    ServerDiscoveryResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/ServerDiscovery"
    ServerFact:
      type: "object"
      additionalProperties: false
      description: "One thing known about a machine, and how it came to be known. A serial the machine reported and one an operator typed are different kinds of knowledge."
      properties:
        key:
          type: "string"
        value:
          type:
            - "string"
