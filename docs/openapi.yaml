          type: "integer"
    ZoneExportResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/ZoneExport"
    ZoneImportEntry:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type: "string"
          enum:
            - "add"
            - "update"
            - "remove"
            - "unchanged"
            - "refused"
            - "ignored"
        line:
          type:
            - "integer"
            - "null"
          description: "The line of the file, where the entry came from one."
        type:
          type:
            - "string"
            - "null"
        name:
          type:
            - "string"
            - "null"
        content:
          type:
            - "string"
            - "null"
          description: "The value, or for a refused or ignored line the line's text."
        ttl:
          type:
            - "integer"
            - "null"
        priority:
          type:
            - "integer"
            - "null"
        existing_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        reason:
          type:
            - "string"
            - "null"
    ZoneImportPlan:
      type: "object"
      additionalProperties: false
      properties:
        zone_id:
          "$ref": "#/components/schemas/Ulid"
        zone:
          type: "string"
        mode:
          type: "string"
          enum:
            - "merge"
            - "replace"
        applicable:
          type: "boolean"
          description: "False while any entry is refused."
        fingerprint:
          type: "string"
          description: "sha256 over the changes and the zone's current records; send it back to apply."
        counts:
          type: "object"
          additionalProperties:
            type: "integer"
        entries:
          type: "array"
          items:
            "$ref": "#/components/schemas/ZoneImportEntry"
    ZoneImportPlanResponse:
