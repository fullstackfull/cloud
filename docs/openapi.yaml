        ended_at:
          "$ref": "#/components/schemas/Timestamp"
        grace_period_ends_at:
          "$ref": "#/components/schemas/Timestamp"
        is_scheduled_to_cancel:
          type: "boolean"
        data_retention_days:
          type:
