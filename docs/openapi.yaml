          description: "Every machine starts do_not_touch. Nothing raises this except an operator, one rung at a time."
        allow_reimage:
          type: "boolean"
          description: "Separate from the classification on purpose: reimage_allowed says a machine MAY be reimaged, this says one specific machine has been cleared for it. Both are required."
