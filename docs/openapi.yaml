    post:
      operationId: "api_admin_infrastructure_servers_request_deployment"
      tags:
        - "Operator"
      summary: "Queue a run"
      description: |-
        An apply needs a current applicable plan and a standing approval whose fingerprint is that plan's; a verify needs neither and changes nothing. 409 when the machine's classification does not permit the plan's risk, when there is no approval, or when a run is already in flight. The worker re-checks all of it before touching the machine. A run that outlives its deadline is indeterminate and is never retried.

