        source:
          type: "string"
          enum:
            - "declared"
            - "discovered"
            - "derived"
        observed_at:
          "$ref": "#/components/schemas/Timestamp"
        superseded_at:
          "$ref": "#/components/schemas/Timestamp"
    ServerPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/Server"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    ServerResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Server"
    Service:
      type: "object"
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Ulid"
        kind:
          type:
            - "string"
            - "null"
        label:
          type:
            - "string"
            - "null"
        identity:
          type:
            - "string"
            - "null"
          description: "The name the customer knows this by — a hostname, a primary domain, a serial. The label beside it comes from the catalogue and is the same string for everyone who bought the plan. Null while the service is still being created."
        resource:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "The row that fulfils this service, as `{kind, id}`. A service's own id is not the machine's, the hosting account's or the chassis's, so the id a link needs is published rather than guessed. `kind` is a customer-facing family (`vps`, `dedicated`, `hosting`, `wordpress`) and the client owns the route it maps to. Null until something has been created."
        state:
          type:
            - "string"
            - "null"
        is_usable:
          type: "boolean"
        resources:
          type:
            - "object"
            - "null"
          additionalProperties: true
        plan_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        order_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        order_item_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        subscription_id:
          oneOf:
            - "$ref": "#/components/schemas/Ulid"
            - type: "null"
        activated_at:
          "$ref": "#/components/schemas/Timestamp"
        suspended_at:
          "$ref": "#/components/schemas/Timestamp"
        retention_ends_at:
          "$ref": "#/components/schemas/Timestamp"
          description: "When the data behind a stopped service is destroyed. Written down when the service stops rather than computed from a config value, so the date a customer was told cannot move."
        ended_reason:
          type:
            - "string"
            - "null"
          description: "customer_cancelled, non_payment or operator. Only the first is ever acted on automatically."
        terminated_at:
          "$ref": "#/components/schemas/Timestamp"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    ServicePage:
