          "$ref": "#/components/schemas/PaginationMeta"
    SubscriptionResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Subscription"
    TeamInvitation:
      type: "object"
      additionalProperties: false
      description: "An outstanding offer of membership. There is deliberately no token field and no field that could carry one: the row stores a hash, and the only copy of a token is in the mail."
