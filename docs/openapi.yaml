  "/api/admin/infrastructure/servers/{server}/discover":
    post:
      operationId: "api_admin_infrastructure_servers_discover"
      tags:
        - "Operator"
      summary: "Look at a machine and record what it says about itself"
      description: |-
        A connection test with an inventory attached: gated as a read, through the bound BMC, and only if the machine answered usefully is it asked for facts. Facts are versioned — a value that changed supersedes the old row and keeps it; a key no longer reported stops being current. Declared facts are never touched by discovery. Nothing on the machine changes.

        Requires the `infrastructure.manage` permission.
      parameters:
        - name: "server"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/customerId"
