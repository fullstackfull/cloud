        resource:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "What to watch once this finishes, so the client does not infer it."
        requested_at:
          "$ref": "#/components/schemas/Timestamp"
          description: "When the customer asked. A client measures \"this is taking longer than usual\" from here rather than from when its own tab opened, so a reload does not restart the clock on work that has been stuck for an hour."
        started_at:
          "$ref": "#/components/schemas/Timestamp"
        updated_at:
