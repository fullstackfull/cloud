name: CI

on:
  pull_request:
  push:
    # Feature branches too, not only main. CI that runs solely on a pull request
    # is CI that first reports a week of work as broken; and a branch that is
    # pushed but never opened as a PR — which is how this repository has been
    # worked — was never built at all.
    branches: [main, 'claude/**']
  # So a run can be asked for without opening a pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

# Gates that could be handed an empty subject refuse it, and none of them
# asserts a size. Stated once here rather than at every site.
#
# A gate that scans nothing passes silently and reads, in review, exactly like
# a gate that found nothing wrong (F-38). So where a gate's subject is a
# pathspec, a glob or a directory that a rename or a move could empty, it is
# asserted non-empty before the gate runs -- per subject, not as a union,
# because a union stays non-empty while any one of its parts survives.
#
# Membership: a guard is in this class when an empty subject would make the
# gate PASS. One whose empty set would instead produce a flood of failures --
# a false red -- is not: validate-runbooks.py's refusal of an empty set of
# defined commands and validate-monitoring.py's of an empty set of exported
# metrics are of that other kind.
#
# Counting unit: a site is one step, one validator or one Makefile recipe.
# Several sites assert more than one subject, so counting individual guards
# gives a different, also defensible, total. By sites there are twelve:
#   - six steps in this file: "Verify migrations are reversible", "Typecheck
#     and Lint cover every workspace", "Ansible lint", "Fail if a credential
#     was committed under infrastructure/", "Fail if a fake provider is
#     configured outside the development template" and "Fail on unresolved
#     placeholders in application source";
#   - four validators the Infrastructure job runs, each refusing its own
#     empty subject: validate-inventory.py, validate-monitoring.py,
#     validate-runbooks.py and check-ci-cannot-apply.py;
#   - two Makefile recipes that repeat a step here: infra-validate's
#     ansible-lint and lint-frontend.
#
# Non-emptiness, not size: a subject gutted to a single file still passes, and
# that is the bar each site is held to. The one deliberate exception is the
# frontend's exact count of four workspaces, argued at that step. The count
# guards inside the six self-tests the Infrastructure job runs are not
# counterexamples: each counts cases that are literal source in the file
# beside the assertion, reviewer-maintained rather than tool-discovered.
#
# The next increment would be a drift check -- committed expected counts per
# subject, failing on a fall -- and it is deliberately not built here.

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 only. The lock file pins Symfony 8, which requires PHP >= 8.4.1,
        # so the 8.3 entry in this matrix could never install a single package —
        # it failed instantly on every run this workflow has ever had, and
        # composer.json claimed ^8.3 while its own lock file said otherwise.
        php: ['8.4']
        postgres: ['18']
        include:
          # The platform targets PostgreSQL 18, but many operators are still on
          # 16. Prove migrations and queries work on both rather than assuming.
          - php: '8.4'
            postgres: '16'

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: lynomia_test
          POSTGRES_USER: lynomia
          POSTGRES_PASSWORD: lynomia_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lynomia -d lynomia_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # bcmath is required in production: without it (or gmp) brick/math
          # falls back to a slower pure-PHP calculator.
          extensions: pdo_pgsql, redis, intl, mbstring, bcmath, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: apps/control-plane
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('apps/control-plane/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # APP_ENV is set for this step because composer's post-autoload-dump hook
      # runs `artisan package:discover`, which boots the application — and with
      # no .env file yet on the runner, Laravel defaults APP_ENV to production.
      # ProviderRegistryServiceProvider then correctly refuses to boot a
      # production deployment configured with fake providers, composer exits 1,
      # and every step after it is skipped. That is the guard doing its job in a
      # context that is not production; naming the environment is the honest fix,
      # rather than weakening a guard that exists to stop a production system
      # reporting payments it never took.
      - name: Install dependencies
        working-directory: apps/control-plane
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: apps/control-plane
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=lynomia_ci/' .env.testing
          php artisan key:generate --env=testing

      - name: Check code style
        working-directory: apps/control-plane
        run: ./vendor/bin/pint --test

      - name: Verify migrations run from an empty database
        working-directory: apps/control-plane
        env:
          DB_PASSWORD: lynomia_ci
        run: php artisan migrate:fresh --seed --env=testing --force

      # Every migration, not a fixed number of them. This used to pass
      # --step=100, which rolls back at most a hundred and reports success
      # either way: from the 101st migration on, the oldest would never have
      # been reversed and the step would have gone on saying they were. The
      # count is the tracked migrations', asserted non-empty, because a rename
      # of database/migrations would otherwise make this roll back nothing and
      # pass, which is the failure the rest of this file exists to refuse.
      - name: Verify migrations are reversible
        working-directory: apps/control-plane
        env:
          DB_PASSWORD: lynomia_ci
        run: |
          set -euo pipefail
          steps=$(git ls-files -- 'database/migrations/*.php' | wc -l)
          if [ "$steps" -eq 0 ]; then
            echo "::error::No tracked migrations under database/migrations; there is nothing to reverse, which is not a pass."
            exit 1
          fi
          echo "Rolling back all $steps migration(s)."
          php artisan migrate:rollback --env=testing --force --step="$steps"
          php artisan migrate --env=testing --force

      # APP_ENV again, and for the same reason: `artisan test` boots the
      # application before it hands over to PHPUnit, and the runner has no .env
      # — only .env.testing, which Laravel does not read unless APP_ENV says
      # testing. Without it the boot defaults to production, the provider guard
      # refuses, and the suite fails in under a second having run nothing.
      - name: Run tests
        working-directory: apps/control-plane
        env:
          APP_ENV: testing
          DB_PASSWORD: lynomia_ci
        run: php artisan test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, mbstring, bcmath
          coverage: none
          tools: composer:v2

      - name: Install application dependencies
        working-directory: apps/control-plane
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --no-progress

      # Analyser dependencies live in their own manifest so they can never
      # constrain the application's runtime dependency graph.
      - name: Install analysis toolchain
        working-directory: apps/control-plane
        run: composer install --working-dir=tools/phpstan --no-interaction --prefer-dist --no-progress

      # -c, because the configuration lives beside the analyser in its own
      # composer root and not in the directory phpstan is run from. Without it
      # the analyser answers "At least one path must be specified to analyse"
      # and the job fails on its own invocation rather than on the code.
      - name: Run PHPStan
        working-directory: apps/control-plane
        run: tools/phpstan/vendor/bin/phpstan analyse -c tools/phpstan/phpstan.neon --no-progress --memory-limit=1G

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Typecheck and Lint below run `--workspaces`, over every workspace the
      # root package.json declares. They used to pass `--if-present`, and three
      # of the four workspaces defined no scripts, so a type error in
      # packages/ui exited 0 and removing apps/web's own scripts would have
      # made both steps green on zero work. The flag is gone and every
      # package now declares both scripts, so a workspace that loses them fails
      # with "Missing script" instead of vanishing.
      #
      # That leaves the corpus itself, because `"packages/*"` is a glob and a
      # glob that matches nothing narrows the run without a word: move
      # packages/ and both steps lint and typecheck apps/web alone, at exit 0.
      # Two assertions, because the two ways to narrow it are disjoint and
      # neither sees the other's:
      #   - each subject directory has tracked files, which catches the
      #     directory moving and cannot see the glob being deleted from
      #     package.json (the files are still there);
      #   - npm resolves exactly four workspaces, which catches the glob going
      #     and asks npm the question the steps' names claim an answer to.
      # An exact four, where the Ansible subjects below are only asserted
      # non-empty: those are discovered by the tool from the filesystem, while
      # this set is declared in one reviewed file that is itself this gate's
      # subject. Adding a workspace is a deliberate edit of package.json, and
      # changing the four is part of making it. Names are not asserted:
      # renaming a package does not narrow anything.
      #
      # `npm query .workspace` reports the workspace tree npm has INSTALLED,
      # not the globs as written: with nothing installed it reports none while
      # `--workspaces` still runs every declared one, and with a workspace
      # dropped from package.json but still linked it reports the narrowed
      # set, in step with `--workspaces`. In every arrangement measured it
      # disagreed with the steps below only by reporting fewer -- a red, not a
      # silent pass -- and here, straight after `npm ci`, the two are the same.
      #
      # The same two assertions are in the Makefile's lint-frontend, which runs
      # these scripts the way this job does; change one, change both.
      - name: Typecheck and Lint cover every workspace
        run: |
          set -euo pipefail
          for subject in apps/web packages; do
            if [ -z "$(git ls-files -- "$subject")" ]; then
              echo "::error::$subject has no tracked files; the lint and typecheck corpus has narrowed without a word."
              exit 1
            fi
          done
          count=$(npm query .workspace | node -e 'let s = ""; process.stdin.on("data", (c) => { s += c; }).on("end", () => { const w = JSON.parse(s); if (!Array.isArray(w)) { process.exit(3); } console.log(w.length); })')
          if [ "$count" != "4" ]; then
            echo "::error::npm resolves $count workspaces, not 4; the lint and typecheck corpus has changed."
            exit 1
          fi
          echo "npm resolves $count workspaces, and every subject directory has tracked files."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test --workspace=apps/web -- --run

      - name: Production build
        run: npm run build

  openapi:
    name: API description
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # A real OpenAPI 3.1 validator, not a structural assertion in PHP. The
      # difference showed the first time this ran: it caught an empty security
      # requirement serialised as a map instead of a list, and a ULID example
      # that did not match the pattern printed directly above it. Neither is
      # something a hand-rolled check would have looked for.
      #
      # Exits non-zero on errors and zero on warnings, which is the behaviour
      # wanted: one warning stands, on the email-verification endpoint, because
      # it redirects and genuinely has no 2xx response.
      - name: Validate docs/openapi.yaml
        run: npm run openapi:lint

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lynomia_e2e
          POSTGRES_USER: lynomia
          POSTGRES_PASSWORD: lynomia_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lynomia -d lynomia_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, mbstring, bcmath, sodium, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        working-directory: apps/control-plane
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci

      # The environment the suite serves the API with. `.env` rather than
      # `.env.testing`, because the browser suite deliberately runs the
      # application as a developer runs it — including the session driver, which
      # is the setting a browser is uniquely able to test.
      - name: Prepare environment
        working-directory: apps/control-plane
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=lynomia_ci/' .env
          php artisan key:generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # The suite starts the API and the portal itself, migrates a database
      # whose name it insists contains "e2e", and seeds fixed fixtures.
      - name: Run the browser suite
        working-directory: apps/web
        env:
          DB_PASSWORD: lynomia_ci
          E2E_DB_DATABASE: lynomia_e2e
        run: npm run test:e2e

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      # --locked: this job deliberately does not install, so there are no
      # installed packages to audit and `composer audit` alone exits 1 with
      # "No installed packages found" — a failure about the job's own shape
      # rather than about a vulnerability. The lock file is what pins the
      # versions a deployment gets, so it is the right thing to audit here.
      - name: Audit PHP dependencies
        working-directory: apps/control-plane
        run: composer audit --locked --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Fail if a secret or environment file was committed
        run: |
          set -euo pipefail
          echo "Scanning tracked files for committed secrets..."

          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked in git."
            exit 1
          fi

          if git ls-files | grep -E '\.(pem|key|p12|pfx)$|(^|/)id_(rsa|ed25519|ecdsa)$'; then
            echo "::error::A private key appears to be tracked in git."
            exit 1
          fi

          # Credential shapes that must never appear in tracked source.
          #
          # Two files are excluded and no more. SecretRedactor.php has to carry
          # the patterns it matches, and tests/Support/SecretFixtures.php is the
          # single declared home for the synthetic credentials the redaction
          # tests need — a redaction test whose fixture does not look like a
          # credential proves nothing. Excluding the test tree instead would
          # mean a real key pasted into a test was no longer caught, which is
          # the one thing this step exists to prevent.
          if git grep -nIE '(sk_live_[A-Za-z0-9]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
              -- ':!*.example' \
                 ':!**/SecretRedactor.php' \
                 ':!apps/control-plane/tests/Support/SecretFixtures.php'; then
            echo "::error::A live credential appears to be committed."
            exit 1
          fi

          echo "No committed secrets found."

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators' dependencies
        run: pip install --quiet pyyaml ansible-core==2.18.1 ansible-lint==24.12.2

      # Every host in an inventory is a machine somebody may be about to
      # change. safety_class is the question that comes before the per-operation
      # flags this tree already uses: may we connect to it and write to it at
      # all? A host with no answer is DO_NOT_TOUCH, not an implicit yes.
      - name: Inventory safety classification
        run: python3 infrastructure/scripts/validate-inventory.py infrastructure

      - name: The inventory validator still rejects what it claims to reject
        run: python3 infrastructure/scripts/test_validate_inventory.py

      # check-runner-trust.py decides whether a host can be believed about
      # where it just connected. It is an operator tool, run on a candidate
      # trusted runner and never here — this runner is not that host, and a
      # verdict from it would mean nothing. What CI can check is the one
      # distinction the tool exists to make: a verified certificate for a name
      # that cannot exist is a forgery, and an untrusted one for that same name
      # is not. Get that backwards and the tool clears an intercepted host.
      - name: The runner trust check still tells a forgery from a refusal
        run: python3 infrastructure/scripts/test_check_runner_trust.py

      # A classification the role does not enforce is an assertion, not a gate.
      # This runs safety_gate against a throwaway inventory pointing at
      # localhost, once per class-and-action pair, and checks the play reaches
      # its body exactly when it should.
      - name: The safety gate still refuses what it claims to refuse
        run: infrastructure/scripts/test_safety_gate.sh

      # An alert on a metric nothing emits never fires. It reads as coverage in
      # a review and is silence in an incident.
      - name: Alert rules name metrics something exports
        run: python3 infrastructure/scripts/validate-monitoring.py infrastructure

      # Seven distinct assertions live in that validator and "the job is green"
      # is evidence for none of them individually. This drives it over
      # synthetic trees and requires a red for each.
      - name: The monitoring validator still refuses what it claims to refuse
        run: python3 infrastructure/scripts/test_validate_monitoring.py

      # A command in a runbook that does not exist costs the operator the
      # minutes they have least of.
      - name: Runbooks name commands that exist
        run: python3 infrastructure/scripts/validate-runbooks.py infrastructure

      - name: The runbook validator still refuses a command that does not exist
        run: python3 infrastructure/scripts/test_validate_runbooks.py

      - name: Ansible syntax
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            echo "-- $playbook"
            ansible-playbook -i inventories/staging/hosts.yml "$playbook" --syntax-check
          done

      # Offline so the build does not ask Galaxy whether our own YAML parses.
      #
      # ansible-lint discovers its own corpus and says nothing about its size:
      # with playbooks/ and roles/ both moved out it prints "Passed: 0
      # failure(s), 0 warning(s) on 18 files. Profile 'production' was
      # required, and it passed." at exit 0, down from 126, in a line that
      # reads exactly like a clean run. So each subject is asserted on its own
      # -- a union check would pass while either one survived -- and asserted
      # non-empty, not sized. With roles/ alone gone syntax-check would fail
      # anyway, but only incidentally; this fails for the reason. The same
      # assertion is in the Makefile's infra-validate, which runs this lint the
      # same way; change one, change both.
      - name: Ansible lint
        working-directory: infrastructure/ansible
        run: |
          set -euo pipefail
          for subject in playbooks roles; do
            if [ -z "$(git ls-files -- "$subject")" ]; then
              echo "::error::infrastructure/ansible/$subject has no tracked files; ansible-lint would pass over what is left."
              exit 1
            fi
          done
          ansible-lint --offline

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.7

      # Known, and deliberately not changed by F-38: the `validate` half of
      # this step's name is not met. The loop runs inside
      # infrastructure/tofu/environments/*/, and those directories hold no .tf
      # file at all -- only .example templates -- while every .tf file in the
      # tree is in infrastructure/tofu itself or its two modules. So
      # `tofu validate` never parses a line of this repository's configuration.
      # What has not been measured is the one remaining fact: whether OpenTofu
      # 1.8.7 exits 0 or non-zero on a directory with no configuration in it
      # (the binary was not available where this was examined). Either answer
      # leaves the step not doing what it says; `fmt -check` does reach every
      # .tf file.
      - name: OpenTofu is formatted and valid
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infrastructure/tofu
          for dir in infrastructure/tofu/environments/*/; do
            echo "-- $dir"
            # -backend=false: CI has no business holding state credentials, and
            # does not need them to decide whether the configuration parses.
            ( cd "$dir" && tofu init -backend=false -input=false && tofu validate )
          done

      # Nothing in this job applies anything. A pipeline that can reimage a node
      # on merge is a pipeline that eventually will, on a branch nobody meant to
      # merge. CI validates; a person applies.
      - name: No workflow applies infrastructure
        run: python3 infrastructure/scripts/check-ci-cannot-apply.py .

      # Including the distinction that makes it usable rather than merely
      # strict: `ansible-playbook --check` is not an apply, and a gate that
      # cannot tell the two apart is a gate somebody eventually switches off.
      - name: The no-apply gate still tells an apply from a check run
        run: python3 infrastructure/scripts/test_check_ci_cannot_apply.py

      # infrastructure/ is the tree that talks to everything, so it is the
      # likeliest place for a credential to be committed.
      #
      # Asserted present first. `git ls-files infrastructure` over a path that
      # is not there prints nothing, grep finds nothing in nothing, and the
      # step used to announce "No committed credentials under infrastructure/"
      # about a directory that no longer existed -- a renamed tree with a
      # tfstate in it, which only this step looks for, went through clean.
      - name: Fail if a credential was committed under infrastructure/
        run: |
          set -euo pipefail
          if [ -z "$(git ls-files -- infrastructure)" ]; then
            echo "::error::infrastructure/ has no tracked files; this scan would have nothing to scan."
            exit 1
          fi
          if git ls-files infrastructure | grep -E '\.(pem|key|p12|pfx|tfstate)$|(^|/)id_(rsa|ed25519|ecdsa)$'; then
            echo "::error::A key or state file is tracked under infrastructure/."
            exit 1
          fi
          echo "No committed credentials under infrastructure/."

  production-guards:
    name: Production guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fail if a fake provider is configured outside the development template
        run: |
          set -euo pipefail

          # The control that actually protects production is a boot-time refusal
          # in ProviderRegistryServiceProvider, covered by
          # tests/Feature/Security/ProductionGuardTest.php. Assert it is still
          # there: a guard whose test has been deleted is not a guard.
          if [ ! -f apps/control-plane/src/Providers/ProviderRegistryServiceProvider.php ] \
            || [ ! -f apps/control-plane/tests/Feature/Security/ProductionGuardTest.php ]; then
            echo "::error::The production provider guard or its test is missing."
            exit 1
          fi

          # Defence in depth over anything the repository itself ships that could
          # set a provider. Three templates are excluded, by exact name and no
          # more: the two development templates, and the testing template —
          # where `fake` is not a lapse but the requirement, because a test run
          # that reaches a real provider bills a real card or creates a real
          # machine. Excluding by pattern instead (any `*.example`) would let a
          # deployment template ship `fake` unnoticed, which is the case this
          # step exists to catch.
          #
          # A guard that has nothing to scan passes silently and reads, in
          # review, exactly like a guard that found nothing wrong. This step
          # used to scan `deployments/production`, a directory that is not in
          # the repository at all, and had therefore never checked anything.
          #
          # The fix for that asked a weaker question than it needed to: whether
          # the UNION of its pathspecs was empty. `'*.env*'` alone keeps a union
          # non-empty, and the third pathspec, `'deployments/**'`, matched
          # nothing at all, there being no deployments/ directory -- so with
          # infrastructure/ renamed, every template in it left the scan and the
          # step still passed. So each pathspec is asserted on its own, and the
          # one that matches nothing is gone rather than asserted.
          specs=('*.env*' 'infrastructure/**')
          for spec in "${specs[@]}"; do
            if [ -z "$(git ls-files -- "$spec")" ]; then
              echo "::error::'$spec' matches no tracked file; this guard's subject has moved."
              exit 1
            fi
          done

          # Regular files only: a tracked symlink to a directory would make
          # grep emit a warning that reads like an error and hides real ones.
          # There is one today, infrastructure/ansible/playbooks/group_vars, so
          # the scan sees one file fewer under infrastructure/ than git tracks.
          templates=$(git ls-files -- "${specs[@]}" \
            | grep -vx 'apps/control-plane/.env.example' \
            | grep -vx 'apps/control-plane/.env.testing.example' \
            | grep -vx '.env.example' \
            | while read -r file; do [ -f "$file" ] && printf '%s\n' "$file"; done || true)

          if [ -z "$templates" ]; then
            echo "::error::This guard has no files to scan; its paths are wrong."
            exit 1
          fi

          if printf '%s\n' $templates | xargs -r grep -nE '_PROVIDER[=:][[:space:]]*["'"'"']?fake'; then
            echo "::error::A fake provider is configured outside the development template."
            exit 1
          fi

          echo "No fake provider configured outside the development template."

      # "Application source" is what PHPStan's `paths` and phpunit.xml's
      # `<source>` both say it is, and that includes apps/control-plane/app,
      # which this step used to leave out: the console command classes (the
      # reconcilers the scheduler runs, and the operator commands nobody
      # schedules), the queue's retry clocks and double-run refusal, a service
      # provider and the base controller. All of it is scanned, regardless of what schedules it.
      #
      # Each subject is asserted to have tracked files first, because
      # `git grep` over a pathspec that matches nothing exits 1 -- the same
      # status as a clean tree -- so a rename would make this step a permanent
      # pass.
      - name: Fail on unresolved placeholders in application source
        run: |
          set -euo pipefail
          subjects=(apps/control-plane/src apps/control-plane/app apps/web/src)
          for subject in "${subjects[@]}"; do
            if [ -z "$(git ls-files -- "$subject")" ]; then
              echo "::error::$subject has no tracked files; a scan of it would pass by finding nothing."
              exit 1
            fi
          done
          if git grep -nIE 'TODO: implement|FIXME: required|NotImplementedException' \
              -- "${subjects[@]}"; then
            echo "::error::Unresolved implementation placeholder in application source."
            exit 1
          fi
          echo "No unresolved placeholders."
